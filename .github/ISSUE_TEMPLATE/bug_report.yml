name: Bug report
description: Something does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search the existing issues first.
        **Security problems must not be reported here**: see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Section designer
        - Site / template editor
        - Publishing and public sites
        - API
        - Docker / local setup
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as the site owner
        2. Open Harbor & Pine Wealth Partners
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or ProblemDetails responses
      description: Remove any personal data first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: How you ran Strata (dev scripts or Docker Compose), OS and browser.
      placeholder: ./scripts/dev.sh on macOS 15, Chrome 142
