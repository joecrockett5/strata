# Serves the editor SPA and reverse-proxies the API so everything is same-origin.

# Public sites on {siteSlug}.localhost: pass every request to the API, keeping the Host header.
server {
    listen 80;
    server_name ~^(?<site>[a-z0-9-]+)\.localhost$;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    location ~ ^/(api|media|site-assets|s|health|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
