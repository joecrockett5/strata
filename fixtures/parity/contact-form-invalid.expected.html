<div
  class="st-site st-radius-small st-font-heading-transitional st-font-body-system-ui"
  style="
    --st-color-primary: #1f4e5f;
    --st-color-on-primary: #ffffff;
    --st-color-secondary: #4a6b5d;
    --st-color-accent: #c9822b;
    --st-color-background: #ffffff;
    --st-color-surface: #f3f5f4;
    --st-color-text: #1c2321;
    --st-color-muted-text: #55605c;
  "
>
  <section
    id="section-aaaaaaaa-0000-4000-8000-000000000006"
    class="st-section st-section--bg-background st-section--pad-lg st-section--width-standard"
  >
    <div class="st-section__inner">
      <div
        class="st-columns st-columns--ratio-1-1 st-columns--stack-tablet st-columns--valign-start st-gap-xl"
      >
        <div class="st-columns__col">
          <h2 class="st-heading st-align-start">Get in touch</h2>
          <div class="st-richtext st-align-start">
            <p>12 Harbor Street<br />Portland, ME</p>
          </div>
        </div>
        <div class="st-columns__col">
          <form class="st-form" novalidate="" action="/s/demo/_contact" method="post">
            <input type="hidden" name="sectionId" value="aaaaaaaa-0000-4000-8000-000000000006" /><input
              type="hidden"
              name="pageId"
              value="11111111-1111-4111-8111-000000000003"
            />
            <div class="st-form__field">
              <label for="contact-aaaaaaaa-0000-4000-8000-000000000006-name">Name</label
              ><input
                type="text"
                id="contact-aaaaaaaa-0000-4000-8000-000000000006-name"
                required=""
                maxlength="100"
                autocomplete="name"
                name="name"
                value="Sam &lt;Lee&gt;"
              />
            </div>
            <div class="st-form__field">
              <label for="contact-aaaaaaaa-0000-4000-8000-000000000006-email">Email</label
              ><input
                type="email"
                id="contact-aaaaaaaa-0000-4000-8000-000000000006-email"
                required=""
                maxlength="200"
                autocomplete="email"
                aria-invalid="true"
                aria-describedby="contact-aaaaaaaa-0000-4000-8000-000000000006-email-error"
                name="email"
                value="not-an-email"
              />
              <p class="st-form__error" id="contact-aaaaaaaa-0000-4000-8000-000000000006-email-error">
                Enter a valid email address.
              </p>
            </div>
            <div class="st-form__field">
              <label for="contact-aaaaaaaa-0000-4000-8000-000000000006-phone"
                >Phone<span class="st-form__optional"> (optional)</span></label
              ><input
                type="tel"
                id="contact-aaaaaaaa-0000-4000-8000-000000000006-phone"
                maxlength="40"
                autocomplete="tel"
                name="phone"
                value=""
              />
            </div>
            <div class="st-form__field">
              <label for="contact-aaaaaaaa-0000-4000-8000-000000000006-message">Message</label
              ><textarea
                rows="6"
                id="contact-aaaaaaaa-0000-4000-8000-000000000006-message"
                name="message"
                required=""
                maxlength="4000"
                aria-invalid="true"
                aria-describedby="contact-aaaaaaaa-0000-4000-8000-000000000006-message-error"
              >
Hello &amp; welcome</textarea>
              <p class="st-form__error" id="contact-aaaaaaaa-0000-4000-8000-000000000006-message-error">
                Message is too short.
              </p>
            </div>
            <div class="st-form__hp" aria-hidden="true">
              <label for="contact-aaaaaaaa-0000-4000-8000-000000000006-website">Website</label
              ><input
                id="contact-aaaaaaaa-0000-4000-8000-000000000006-website"
                type="text"
                tabindex="-1"
                autocomplete="off"
                name="website"
              />
            </div>
            <div class="st-button-row">
              <button class="st-button st-button--primary" type="submit">Send message</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>
